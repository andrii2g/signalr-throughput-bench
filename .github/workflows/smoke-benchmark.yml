name: smoke-benchmark

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SignalRThroughputBench.slnx
      - run: dotnet build SignalRThroughputBench.slnx --no-restore -c Release
